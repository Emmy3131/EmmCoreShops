
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>

    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- SEO Metadata -->
    <meta
      name="description"
      content="Shop smartphones, laptops, electronics, gadgets and accessories at EmmCoreShops. Discover quality technology products at competitive prices with convenient and secure online shopping."

    <meta
      name="keywords"

    <meta name="theme-color" content="#0B1F3A" />
    <meta name="application-name" content="EmmCoreShops" />

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="EmmCoreShops | Shop Smart. Live Better."

    <meta
      property="og:description"

    <meta
      property="og:url"
      content="https://emm-core-shops.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://emm-core-shops.vercel.app/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://emm-core-shops.vercel.app/og-image.png"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="EmmCoreShops - Your One-Stop Tech Store. Shop Smart. Live Better."

    <meta property="og:locale" content="en_NG" />

      name="twitter:title"

      rel="canonical"
      href="https://emm-core-shops.vercel.app/"
